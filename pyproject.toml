[project]
name = "agent-factory"
version = "0.1.0"
description = "Local-first engineering harness that gives coding agents persistent codebase memory in Neo4j, reusable skills, architectural context, and evidence-driven workflows."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Deokar" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0",
    "neo4j>=6.3.1",
    "neo4j-agent-memory[nams,openai]>=0.6.0",
    "neo4j-graphrag[openai]>=1.21.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.20.0",
    "typer>=0.27.2",
]

[project.scripts]
agent-factory = "agent_factory.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "syrupy>=6.1.1",
    "testcontainers[neo4j]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure Python, no network (default)",
    "neo4j: needs a Neo4j database (testcontainers or AF_TEST_NEO4J_URI)",
    "contract: MCP tool and CLI JSON contracts",
    "e2e: full loop through the CLI/MCP",
    "eval: retrieval and reuse quality gates",
    "live: real Aura, LLM and embeddings; opt-in",
    "agent: real coding agent runs; opt-in",
]
# Default run = unit only. CI and the phase Definition of Done use: -m "not live and not agent"
addopts = "-m 'not neo4j and not contract and not e2e and not eval and not live and not agent' -ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/spikes/code", "skills", "tests/test_record.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["agent_factory"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
